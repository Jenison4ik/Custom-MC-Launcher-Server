version: "3.9" # Версия Docker Compose, 3.9 — современная и поддерживает все нужные возможности

services:
  app:
    build: .
    container_name: server_app
    restart: always
    env_file:
      - .env # Подключаем переменные окружения из файла .env
    environment:
      - PORT=${PORT}
      - SECRET_KEY=${SECRET_KEY}
    expose:
      - "${PORT}"
    volumes:
      - ./data:/app/data
      - ./game:/app/game
      - ./launcher:/app/launcher
      - ./builds:/app/builds
    networks:
      - webnet

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80" # HTTP для первоначальной выдачи сертификата
      - "443:443" # HTTPS
    volumes:
      - ./docker_nginx_temp:/var/cache/nginx/client_temp
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro # Полная конфигурация с HTTPS
      - ./nginx/nginx-init.conf.template:/etc/nginx/templates/nginx-init.conf.template:ro # Начальная конфигурация без HTTPS
      - ./nginx/entrypoint.sh:/docker-entrypoint.sh:ro # Entrypoint скрипт
      - ./nginx/certbot/conf:/etc/letsencrypt # Сертификаты Let's Encrypt
      - ./nginx/certbot/www:/var/www/certbot # Временная папка для проверки домена
      - ./static:/app/server_app/static # Стандартная статическая страница
    depends_on:
      - app
    environment:
      - DOMAIN=${DOMAIN}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    networks:
      - webnet

  # Сервис для первоначального получения сертификатов
  # Использование: docker-compose --profile init run --rm certbot-init
  certbot-init:
    image: certbot/certbot
    container_name: certbot_init
    env_file:
      - .env # Подключаем переменные окружения из файла .env
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "
        if [ -z \"$$DOMAIN\" ]; then
          echo '❌ Ошибка: переменная DOMAIN не установлена';
          exit 1;
        fi
        EMAIL=\"$${LETSENCRYPT_EMAIL:-admin@$$DOMAIN}\"
        CERT_DIR=\"/etc/letsencrypt\"
        LIVE_DIR=\"$$CERT_DIR/live\"
        ARCHIVE_DIR=\"$$CERT_DIR/archive\"
        RENEWAL_DIR=\"$$CERT_DIR/renewal\"
        
        echo \"🔐 Получение SSL сертификатов для $$DOMAIN...\";
        echo \"📧 Email для уведомлений: $$EMAIL\";
        
        # Удаляем все старые сертификаты для этого домена
        echo '🧹 Очистка старых сертификатов...';
        rm -rf \"$$LIVE_DIR/$$DOMAIN\"* 2>/dev/null
        rm -rf \"$$ARCHIVE_DIR/$$DOMAIN\"* 2>/dev/null
        rm -f \"$$RENEWAL_DIR/$$DOMAIN\"*.conf 2>/dev/null
        echo '✅ Старые сертификаты удалены';
        
        # Получаем новый сертификат
        certbot certonly --non-interactive --webroot -w /var/www/certbot --email \"$$EMAIL\" --agree-tos --no-eff-email -d \"$$DOMAIN\" -d \"www.$$DOMAIN\" && {
          # Ищем созданный сертификат
          NEW_CERT=\$(ls -d \"$$LIVE_DIR/$$DOMAIN\"* 2>/dev/null | head -1)
          if [ -n \"$$NEW_CERT\" ] && [ -f \"$$NEW_CERT/fullchain.pem\" ]; then
            echo '✅ Сертификаты успешно получены!';
            echo \"📁 Путь к сертификату: $$NEW_CERT/fullchain.pem\";
            # Проверяем, сколько сертификатов осталось
            CERT_COUNT=\$(ls -d \"$$LIVE_DIR/$$DOMAIN\"* 2>/dev/null | wc -l)
            if [ \"$$CERT_COUNT\" -gt 1 ]; then
              echo '⚠️ Обнаружено несколько сертификатов, оставляем только последний...';
              # Оставляем только последний (самый новый)
              ls -dt \"$$LIVE_DIR/$$DOMAIN\"* 2>/dev/null | tail -n +2 | xargs rm -rf 2>/dev/null
              echo '✅ Лишние сертификаты удалены';
            fi
            echo '🔄 Перезагрузите nginx: docker exec nginx_proxy nginx -s reload';
          else
            echo '⚠️ Сертификат получен, но файл не найден';
          fi
        } || {
          echo '❌ Ошибка при получении сертификатов';
          exit 1;
        }
      "
    depends_on:
      - nginx
    environment:
      - DOMAIN=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
    networks:
      - webnet
    profiles:
      - init # Запускается только с профилем init: docker-compose --profile init run --rm certbot-init

  # Сервис для автоматического обновления сертификатов
  # Использование: docker-compose --profile renew up -d certbot
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot;
        docker exec nginx_proxy nginx -s reload;
        sleep 12h;
      done"
    depends_on:
      - nginx
    networks:
      - webnet
    profiles:
      - renew # Запускается только с профилем renew: docker-compose --profile renew up -d certbot

networks:
  webnet:
    driver: bridge
